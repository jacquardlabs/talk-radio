{% extends "base.html" %}

{% block title %}Stations — Sonos Talk Radio{% endblock %}

{% block content %}
<div class="eyebrow"><span>Find an episode</span></div>
<input type="search" id="global-search-input" placeholder="Search all stations by episode or show title" style="width:100%">
<div class="svc" id="global-search-results"></div>
<div id="global-search-pagination"></div>

<div class="eyebrow"><span>Stations</span><span id="stn-summary"></span></div>
<div class="crate-toolbar">
  <input type="search" id="station-filter" placeholder="Filter stations by name">
  <div class="artmode">
    <button type="button" class="tab small" data-artmode="amber">Tinted</button>
    <button type="button" class="tab small" data-artmode="color">Color</button>
  </div>
</div>
<div id="station-groups"></div>

<div class="eyebrow"><span>Add station</span></div>
<div class="tabs" style="margin-top:0">
  <button type="button" class="tab small live" id="mode-search" data-add-mode="search">Search</button>
  <button type="button" class="tab small" id="mode-url" data-add-mode="url">Paste URL</button>
</div>
<div id="podcast-search-block">
  <input type="search" id="podcast-search-input" placeholder="Podcast name" style="width:100%;margin-top:8px">
  <div class="svc" id="podcast-search-results"></div>
</div>
<div id="podcast-picked-block" style="display:none">
  <div class="svc-row">
    <img class="pod-art" id="podcast-picked-art" src="" alt="">
    <span class="glow" id="podcast-picked-title"></span>
    <span class="spacer"></span>
    <button type="button" class="tab small" id="podcast-picked-change">Change</button>
  </div>
</div>
<form class="inline" id="add-feed">
  <input type="url" id="feed-url" placeholder="RSS URL" required style="display:none">
  <label class="chk"><input type="checkbox" id="feed-news"> News</label>
  <select id="feed-include" aria-label="How much back catalog">
    <option value="latest" selected>Latest episode</option>
    <option value="new_only">New episodes only</option>
    <option value="last_n">Last N episodes</option>
    <option value="all">Entire back catalog</option>
  </select>
  <input type="number" id="feed-count" min="1" value="5" style="display:none;width:80px" aria-label="How many">
  <button type="submit" class="tab">Add station</button>
</form>

<div class="eyebrow"><span>Add category</span></div>
<form class="inline" id="add-category">
  <input type="text" id="category-name" placeholder="New category name" required>
  <button type="submit" class="tab">Add category</button>
</form>

<div class="mini-transport" id="mini-transport" hidden>
  <button type="button" class="tab small" id="mini-playpause" aria-label="Play or pause">&#9654;</button>
  <a href="/" id="mini-now" title="Open the board"><span class="m">Off air</span></a>
</div>
{% endblock %}

{% block script %}
<script>
"use strict";
let expandedFeedId = null;
let stationFilter = "";
let lastStationsSig = "";
const globalSearch = { q: "", page: 1 };
const stationSearch = {};   // feedId -> { q, page }
const selectMode = {};      // feedId -> bool
const selectedIds = {};     // feedId -> Set<number>

function episodeState(feedId) {
  return stationSearch[feedId] || (stationSearch[feedId] = { q: "", page: 1 });
}

// ── shared episode rendering (station panel + global search) ────────
// One spelled-out primary (Play next) and a flap for the rest, matching the
// board's Drop ▾ pattern: four buttons per row wrapped ragged and buried the
// occasional verbs under 60+ uppercase labels a page.
// Which row's flap is open lives here for the same reason as openDropId:
// these rows re-render under the reader.
let openEpMenuId = null;

function epMenu(e) {
  const open = openEpMenuId === String(e.id);
  return `<div class="dropwrap">` +
    `<button type="button" class="tab small" data-epmenu="${e.id}" ` +
    `aria-haspopup="true" aria-expanded="${open}" ` +
    `aria-label="More actions for ${esc(e.title)}">More &#9662;</button>` +
    `<div class="flap" data-epflap="${e.id}"${open ? "" : " hidden"}>` +
    `<button type="button" data-episode="${e.id}/play_now">Play now <i>interrupt</i></button>` +
    `<button type="button" data-episode="${e.id}/play_last">Add to Up Next <i>end of queue</i></button>` +
    (e.arc
      ? `<button type="button" data-episode="${e.id}/queue_arc">Queue series <i>every part, in order</i></button>` : "") +
    (e.status === "archived"
      ? `<button type="button" data-episode="${e.id}/release">Release <i>out of the vault</i></button>` : "") +
    `</div></div>`;
}

function setEpMenuOpen(id) {
  openEpMenuId = id;
  for (const flap of document.querySelectorAll("[data-epflap]"))
    flap.hidden = flap.dataset.epflap !== id;
  for (const b of document.querySelectorAll("[data-epmenu]"))
    b.setAttribute("aria-expanded", String(b.dataset.epmenu === id));
}

function episodeRow(e, opts) {
  opts = opts || {};
  const statusClass = { played: "ok", skipped: "pri", archived: "m" }[e.status] || "glow";
  const checkbox = opts.checkbox
    ? `<input type="checkbox" data-episode-check="${e.id}"${opts.selected ? " checked" : ""}>`
    : "";
  const mins = e.duration ? ` &middot; ${Math.round(e.duration / 60)} min` : "";
  return `<div class="svc-row ep-row">` +
    checkbox +
    `<span class="st ${statusClass}">${esc(e.status)}</span>` +
    (opts.showBadge ? `<span class="m">${esc(e.show)}</span>` : "") +
    `<span class="glow">${esc(e.title)}</span>` +
    // the caret hugs the title it discloses; at the row's end flex-wrap
    // orphaned it onto its own line between rows
    discToggle(e.id, e.description, e.title) +
    `<span class="m">${esc((e.published_at || "").slice(0, 10))}${mins}</span>` +
    (e.failures
      ? `<span class="st pri" title="Sonos accepted this episode but no audio came out">` +
        `${e.failures}&times; no audio</span>` : "") +
    `<span class="ep-actions">` +
    `<button type="button" class="tab small" data-episode="${e.id}/play_next" title="Play after current">Play next</button>` +
    epMenu(e) +
    `</span>` +
    discPanel(e.id, e.description) +
    `</div>`;
}

function paginationHTML(page, pageSize, total, kind, key) {
  const pages = Math.max(1, Math.ceil(total / pageSize));
  return `<div class="pagination">` +
    `<button type="button" class="tab small" data-page="${kind}:${key}:${page - 1}" ${page <= 1 ? "disabled" : ""}>Prev</button>` +
    `<span>Page ${page} of ${pages} (${total})</span>` +
    `<button type="button" class="tab small" data-page="${kind}:${key}:${page + 1}" ${page >= pages ? "disabled" : ""}>Next</button>` +
    `</div>`;
}

// ── the record crate: category shelves of artwork tiles ────────────
function tileHTML(f) {
  const u = f.counts.new + f.counts.queued;
  const open = expandedFeedId === f.id;
  const art = f.image_url
    ? `<img src="${esc(f.image_url)}" alt="" loading="lazy">`
    : `<span class="noart"></span>`;
  return `<button type="button" class="tile${open ? " open" : ""}${f.enabled ? "" : " held"}" ` +
    `data-tile="${f.id}" aria-expanded="${open}" title="${esc(f.title)}">` +
    art +
    (u > 1 ? `<span class="bdg">${u.toLocaleString()}</span>` : "") +
    `<span class="tnm">${esc(f.title)}</span>` +
    (f.enabled ? "" : '<span class="theld">Held</span>') +
    `</button>`;
}

function sheetHeadHTML(f, categories) {
  const c = f.counts;
  const unplayed = c.new + c.queued;
  const categoryOptions = `<option value=""${f.category_id == null ? " selected" : ""}>Uncategorized</option>` +
    categories.map((cat) =>
      `<option value="${cat.id}"${f.category_id === cat.id ? " selected" : ""}>${esc(cat.name)}</option>`
    ).join("");
  return (f.image_url ? `<img class="sheet-art" src="${esc(f.image_url)}" alt="">` : '<span class="sheet-art"></span>') +
    `<div class="sheet-main">` +
    `<div class="sheet-top"><span class="sheet-title glow">${esc(f.title)}</span>` +
    `<button type="button" class="sheet-close" data-close-sheet>Close &times;</button></div>` +
    // The show's own blurb, always open — it is what the sheet is about, and
    // unlike an episode's notes there is only ever one of it.
    (f.description ? `<div class="sheet-desc">${esc(f.description)}</div>` : "") +
    `<div class="sheet-counts"><b>${unplayed.toLocaleString()} unplayed</b> &middot; ` +
    `${c.played.toLocaleString()} played &middot; ${c.archived.toLocaleString()} in the vault` +
    (f.is_news ? ' &middot; <span class="pri">NEWS</span>' : "") +
    (f.enabled ? "" : ' &middot; <span class="pri">HELD</span>') +
    // One episode failing is bad luck; a whole station failing is a broken
    // feed, and the count is what tells those apart at a glance.
    (f.failures
      ? ` &middot; <span class="pri" title="Episodes the speaker accepted but played no audio for">` +
        `${f.failures.toLocaleString()} wouldn't play</span>` : "") + `</div>` +
    `<div class="stn-admin">` +
    `<select data-feed-category="${f.id}" aria-label="Category">${categoryOptions}</select>` +
    `<button type="button" class="tab small" data-feed="${f.id}/news">${f.is_news ? "Not news" : "Mark news"}</button>` +
    `<button type="button" class="tab small" data-feed="${f.id}/toggle">${f.enabled ? "Pause" : "Enable"}</button>` +
    `<button type="button" class="tab small" data-feed="${f.id}/playback" title="How the DJ picks this show's next episode">${f.playback_mode === "random" ? "Random" : "In order"}</button>` +
    (c.archived ? `<button type="button" class="tab small" data-feed="${f.id}/unarchive">Add back catalog</button>` : "") +
    `<button type="button" class="tab small red" data-feed="${f.id}/delete" data-confirm="1">Remove station</button>` +
    `</div></div>`;
}

// Rename/Remove fold behind a ⋯ flap: rotation is the everyday control,
// category admin is twice a year, and REMOVE at equal weight beside a daily
// toggle is an invitation to the wrong tap.
let openCatMenuId = null;

function setCatMenuOpen(id) {
  openCatMenuId = id;
  for (const flap of document.querySelectorAll("[data-catflap]"))
    flap.hidden = flap.dataset.catflap !== id;
  for (const b of document.querySelectorAll("[data-catmenu]"))
    b.setAttribute("aria-expanded", String(b.dataset.catmenu === id));
}

function groupHeadHTML(cat, rows) {
  const count = rows.length;
  const unplayed = rows.reduce((n, f) => n + f.counts.new + f.counts.queued, 0);
  const cnt = `<span class="cnt">${count} station${count === 1 ? "" : "s"} &middot; ${unplayed.toLocaleString()} unplayed</span>`;
  if (!cat) return `<span class="glow">Uncategorized</span>` + cnt;
  const open = openCatMenuId === String(cat.id);
  return `<span class="glow">${esc(cat.name)}</span>` + cnt +
    `<span class="spacer"></span>` +
    `<button type="button" class="tab small${cat.rotation_enabled ? " live" : " red"}" data-category="${cat.id}/toggle">` +
    `${rotationLabel(cat.rotation_enabled)}</button>` +
    `<div class="dropwrap">` +
    `<button type="button" class="tab small" data-catmenu="${cat.id}" ` +
    `aria-haspopup="true" aria-expanded="${open}" ` +
    `aria-label="Actions for ${esc(cat.name)}">Edit &#9662;</button>` +
    `<div class="flap" data-catflap="${cat.id}"${open ? "" : " hidden"}>` +
    `<button type="button" data-category-rename="${cat.id}">Rename</button>` +
    `<button type="button" class="danger" data-category="${cat.id}/delete" data-confirm="1">` +
    `Remove <i>stations stay, uncategorized</i></button>` +
    `</div></div>`;
}

function buildGroups(s) {
  const byCat = new Map();
  for (const f of s.stations) {
    if (stationFilter && !f.title.toLowerCase().includes(stationFilter)) continue;
    const key = f.category_id == null ? "un" : f.category_id;
    if (!byCat.has(key)) byCat.set(key, []);
    byCat.get(key).push(f);
  }
  const groups = (s.categories || []).map((cat) => ({ key: `c${cat.id}`, cat, rows: byCat.get(cat.id) || [] }));
  if (byCat.has("un")) groups.push({ key: "un", cat: null, rows: byCat.get("un") });
  // while filtering, drop groups with no matches; otherwise keep empty
  // categories visible so they can be renamed/removed
  return stationFilter ? groups.filter((g) => g.rows.length) : groups;
}

function renderStations(s) {
  const sig = JSON.stringify([s.stations, s.categories, stationFilter, expandedFeedId]);
  if (sig === lastStationsSig) return;   // nothing changed: keep DOM (and focus) intact
  lastStationsSig = sig;

  const container = $("station-groups");
  // the open station sheet survives rebuilds: its episode browser holds
  // search/selection state a poll must never stomp
  let sheet = container.querySelector("[data-sheet]");
  if (sheet) sheet.remove();
  if (sheet && Number(sheet.dataset.sheet) !== expandedFeedId) sheet = null;

  const groups = buildGroups(s);
  container.innerHTML = groups.map((g) =>
    `<section class="shelf${g.cat && !g.cat.rotation_enabled ? " off" : ""}">` +
    `<div class="grp-head">${groupHeadHTML(g.cat, g.rows)}</div>` +
    `<div class="shelf-row">` +
    (g.rows.map(tileHTML).join("") || '<div class="empty">NO STATIONS IN THIS CATEGORY</div>') +
    `</div><div data-sheet-slot></div></section>`
  ).join("") || '<div class="empty">NO STATIONS — ADD ONE BELOW</div>';

  if (expandedFeedId == null) return;
  const tile = container.querySelector(`[data-tile="${expandedFeedId}"]`);
  const feed = s.stations.find((f) => f.id === expandedFeedId);
  if (!tile || !feed) { expandedFeedId = null; return; }
  const slot = tile.closest(".shelf").querySelector("[data-sheet-slot]");
  if (!sheet) {
    sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.dataset.sheet = expandedFeedId;
    sheet.innerHTML = `<div class="sheet-head"></div><div class="ep-browser"></div>`;
    slot.append(sheet);
    renderEpisodePanel(expandedFeedId);
  } else {
    slot.append(sheet);
  }
  const adminSig = JSON.stringify([feed, s.categories]);
  if (sheet._adminSig !== adminSig) {   // don't stomp an open category dropdown
    sheet._adminSig = adminSig;
    sheet.querySelector(".sheet-head").innerHTML = sheetHeadHTML(feed, s.categories || []);
  }
}

async function renderEpisodePanel(feedId) {
  const panel = $("station-groups").querySelector(`[data-sheet="${feedId}"]`);
  if (!panel) return;
  const browser = panel.querySelector(".ep-browser");
  const st = episodeState(feedId);
  const data = await (await fetch(
    `/api/feeds/${feedId}/episodes?page=${st.page}&q=${encodeURIComponent(st.q)}`
  )).json();
  const sel = !!selectMode[feedId];
  const selected = selectedIds[feedId] || (selectedIds[feedId] = new Set());
  const prevInput = browser.querySelector("[data-station-search]");
  const hadFocus = prevInput && document.activeElement === prevInput;
  browser.innerHTML =
    `<div class="ep-toolbar">` +
    `<input type="search" placeholder="Filter this station's episodes" value="${esc(st.q)}" data-station-search="${feedId}">` +
    `<button type="button" class="tab small" data-select-toggle="${feedId}">${sel ? "Done selecting" : "Select"}</button>` +
    (sel ? `<button type="button" class="tab small" data-release-selected="${feedId}">Release selected (${selected.size})</button>` : "") +
    `</div>` +
    (data.episodes.map((e) => episodeRow(e, {
      checkbox: sel && e.status === "archived", selected: selected.has(e.id),
    })).join("") || '<div class="empty">No episodes match</div>') +
    paginationHTML(st.page, data.page_size, data.total, "station", feedId);
  if (hadFocus) {   // the rebuild replaced the input mid-typing
    const input = browser.querySelector("[data-station-search]");
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

async function postEpisodeAction(id, action, btn) {
  const ok = await post(`/episodes/${id}/${action}`, {}, btn);
  if (ok) {
    if (expandedFeedId != null) renderEpisodePanel(expandedFeedId);
    if (globalSearch.q) renderGlobalSearch();
  }
}

async function renderGlobalSearch() {
  const results = $("global-search-results");
  const pager = $("global-search-pagination");
  if (!globalSearch.q) {
    results.innerHTML = "";
    pager.innerHTML = "";
    return;
  }
  const data = await (await fetch(
    `/api/episodes/search?q=${encodeURIComponent(globalSearch.q)}&page=${globalSearch.page}`
  )).json();
  results.innerHTML = data.episodes.map((e) => episodeRow(e, { showBadge: true })).join("")
    || '<div class="empty">No matching episodes</div>';
  pager.innerHTML = data.total ? paginationHTML(data.page, data.page_size, data.total, "global", "q") : "";
}

function renderPage(s) {
  const cats = (s.categories || []).length;
  $("stn-summary").textContent =
    `${s.stations.length} STATIONS · ${cats} CATEGOR${cats === 1 ? "Y" : "IES"}`;
  renderStations(s);
  renderMiniTransport(s);
}

// the phone remote: pausing from this page shouldn't mean navigating back
// to the board first. CSS keeps it display:none above 760px.
function renderMiniTransport(s) {
  const playing = isPlaying(s);
  $("mini-playpause").innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
  $("mini-playpause").setAttribute("aria-label", playing ? "Pause" : "Play");
  const np = s.now_playing;
  $("mini-now").innerHTML = np
    ? `<span class="m">On air</span>${esc(np.title)}`
    : `<span class="m">Off air</span>Open the board`;
  $("mini-transport").hidden = false;
}

$("mini-playpause").addEventListener("click", (ev) => {
  const playing = status && isPlaying(status);
  post(`/player/${playing ? "pause" : "play"}`, {}, ev.currentTarget);
});

function toggleManage(id) {
  expandedFeedId = expandedFeedId === id ? null : id;
  if (status) renderStations(status);
  if (expandedFeedId != null) {
    const sheet = $("station-groups").querySelector("[data-sheet]");
    const smooth = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
    if (sheet) sheet.scrollIntoView({ behavior: smooth, block: "nearest" });
  }
}

// artwork treatment: amber duotone keeps the crate inside the LED world
function setArtMode(mode) {
  localStorage.setItem("artModeV2", mode);
  document.body.classList.toggle("amber-art", mode === "amber");
  document.querySelectorAll("[data-artmode]").forEach((b) =>
    b.classList.toggle("live", b.dataset.artmode === mode));
}
setArtMode(localStorage.getItem("artModeV2") || "color");

// ── podcast search (add station) ──────────────────────────────────
let addMode = "search";
let pickedPodcast = null;
let podcastResults = [];

function setAddMode(mode) {
  addMode = mode;
  $("mode-search").classList.toggle("live", mode === "search");
  $("mode-url").classList.toggle("live", mode === "url");
  $("podcast-search-block").style.display = mode === "search" && !pickedPodcast ? "" : "none";
  $("podcast-picked-block").style.display = mode === "search" && pickedPodcast ? "" : "none";
  $("feed-url").style.display = mode === "url" ? "" : "none";
  if (mode === "url") {
    pickedPodcast = null;
    $("feed-url").value = "";
  } else {
    $("podcast-search-input").value = "";
    $("podcast-search-results").innerHTML = "";
    if (!pickedPodcast) $("feed-url").value = "";
  }
}

function podcastResultRow(p, i) {
  return `<div class="svc-row">` +
    `<img class="pod-art" src="${esc(p.artwork_url)}" alt="">` +
    `<span class="glow">${esc(p.title)}</span>` +
    `<span class="m">${esc(p.author)}</span>` +
    `<span class="spacer"></span>` +
    `<button type="button" class="tab small" data-pick-podcast="${i}">Use this</button>` +
    `</div>`;
}

async function runPodcastSearch(term) {
  const results = $("podcast-search-results");
  if (!term) { results.innerHTML = ""; podcastResults = []; return; }
  const data = await (await fetch(`/api/podcasts/search?q=${encodeURIComponent(term)}`)).json();
  if (data.error) flash(data.error);
  podcastResults = data.results;
  results.innerHTML = podcastResults.map(podcastResultRow).join("") || '<div class="empty">NO MATCHES</div>';
}

function pickPodcast(p) {
  pickedPodcast = p;
  $("feed-url").value = p.feed_url;
  $("podcast-picked-art").src = p.artwork_url;
  $("podcast-picked-title").textContent = p.title;
  $("podcast-search-block").style.display = "none";
  $("podcast-picked-block").style.display = "";
}

// ── wire up ────────────────────────────────────────────────────────
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { setEpMenuOpen(null); setCatMenuOpen(null); }
});
document.addEventListener("click", (ev) => {
  if (!ev.target.closest(".dropwrap")) { setEpMenuOpen(null); setCatMenuOpen(null); }
  const btn = ev.target.closest("button");
  if (!btn) return;
  if (btn.dataset.confirm && !armed(btn)) return;
  if (btn.dataset.epmenu) {
    return void setEpMenuOpen(openEpMenuId === btn.dataset.epmenu ? null : btn.dataset.epmenu);
  }
  if (btn.dataset.catmenu) {
    return void setCatMenuOpen(openCatMenuId === btn.dataset.catmenu ? null : btn.dataset.catmenu);
  }
  if (btn.dataset.tile) return void toggleManage(Number(btn.dataset.tile));
  if ("closeSheet" in btn.dataset) return void toggleManage(expandedFeedId);
  if (btn.dataset.artmode) return void setArtMode(btn.dataset.artmode);
  if (btn.dataset.feed) return void post(`/feeds/${btn.dataset.feed}`, {}, btn);
  if (btn.dataset.episode) {
    const [id, action] = btn.dataset.episode.split("/");
    setEpMenuOpen(null);
    return void postEpisodeAction(id, action, btn);
  }
  if (btn.dataset.page) {
    const [kind, key, page] = btn.dataset.page.split(":");
    const p = Number(page);
    if (p < 1) return;
    if (kind === "global") { globalSearch.page = p; renderGlobalSearch(); }
    else if (kind === "station") { episodeState(Number(key)).page = p; renderEpisodePanel(Number(key)); }
    return;
  }
  if (btn.dataset.selectToggle) {
    const id = Number(btn.dataset.selectToggle);
    selectMode[id] = !selectMode[id];
    if (!selectMode[id] && selectedIds[id]) selectedIds[id].clear();
    return void renderEpisodePanel(id);
  }
  if (btn.dataset.releaseSelected) {
    const id = Number(btn.dataset.releaseSelected);
    const ids = Array.from(selectedIds[id] || []);
    if (!ids.length) return;
    return void post("/episodes/release", { ids }, btn).then((ok) => {
      if (ok) { selectedIds[id].clear(); selectMode[id] = false; }
      renderEpisodePanel(id);
    });
  }
  if (btn.dataset.addMode) return void setAddMode(btn.dataset.addMode);
  if (btn.dataset.pickPodcast) return void pickPodcast(podcastResults[Number(btn.dataset.pickPodcast)]);
  if (btn.id === "podcast-picked-change") {
    pickedPodcast = null;
    $("feed-url").value = "";
    $("podcast-picked-block").style.display = "none";
    $("podcast-search-block").style.display = "";
    return;
  }
  if (btn.dataset.category) {
    if (btn.dataset.category.endsWith("/delete")) setCatMenuOpen(null);
    return void post(`/categories/${btn.dataset.category}`, {}, btn);
  }
  if (btn.dataset.categoryRename) {
    setCatMenuOpen(null);
    const id = btn.dataset.categoryRename;
    const cat = (status.categories || []).find((x) => String(x.id) === id);
    const head = btn.closest(".grp-head");
    if (!cat || !head || head.querySelector("input")) return;
    const nameEl = head.querySelector(".glow");
    const input = document.createElement("input");
    input.type = "text";
    input.value = cat.name;
    input.setAttribute("aria-label", "Category name");
    nameEl.replaceWith(input);
    input.focus();
    input.select();
    let closed = false;
    const done = (save) => {
      if (closed) return;
      closed = true;
      const name = input.value.trim();
      input.replaceWith(nameEl);
      if (save && name && name !== cat.name) post(`/categories/${id}/rename`, { name });
    };
    input.addEventListener("keydown", (ev2) => {
      if (ev2.key === "Enter") done(true);
      else if (ev2.key === "Escape") done(false);
    });
    input.addEventListener("blur", () => done(false));
    return;
  }
});

document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "global-search-input") {
    debounce(el, () => {
      globalSearch.q = el.value;
      globalSearch.page = 1;
      renderGlobalSearch();
    });
  } else if (el.id === "station-filter") {
    debounce(el, () => {
      stationFilter = el.value.trim().toLowerCase();
      if (status) renderStations(status);
    });
  } else if (el.dataset.stationSearch) {
    const feedId = Number(el.dataset.stationSearch);
    debounce(el, () => {
      const st = episodeState(feedId);
      st.q = el.value;
      st.page = 1;
      renderEpisodePanel(feedId);
    });
  } else if (el.id === "podcast-search-input") {
    debounce(el, () => runPodcastSearch(el.value.trim()));
  }
});

document.addEventListener("change", (ev) => {
  const cb = ev.target.closest("input[data-episode-check]");
  if (cb) {
    const panel = cb.closest("[data-sheet]");
    const feedId = Number(panel.dataset.sheet);
    const epId = Number(cb.dataset.episodeCheck);
    const set = selectedIds[feedId] || (selectedIds[feedId] = new Set());
    if (cb.checked) set.add(epId); else set.delete(epId);
    const releaseBtn = panel.querySelector("[data-release-selected]");
    if (releaseBtn) releaseBtn.textContent = `Release selected (${set.size})`;
    return;
  }
  const sel = ev.target.closest("select[data-feed-category]");
  if (sel) {
    post(`/feeds/${sel.dataset.feedCategory}/category`, { category_id: sel.value || null });
  }
});

$("feed-include").addEventListener("change", (ev) => {
  $("feed-count").style.display = ev.target.value === "last_n" ? "" : "none";
});
$("add-feed").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const ok = await post("/feeds", {
    url: $("feed-url").value,
    is_news: $("feed-news").checked,
    include: $("feed-include").value,
    count: $("feed-count").value,
  });
  if (ok) {
    $("feed-url").value = "";
    pickedPodcast = null;
    $("podcast-search-input").value = "";
    $("podcast-search-results").innerHTML = "";
    setAddMode(addMode);
    flash("Station added", true);
  }
});

$("add-category").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const ok = await post("/categories", { name: $("category-name").value });
  if (ok) { $("category-name").value = ""; flash("Category added", true); }
});

setAddMode("search");
</script>
{% endblock %}
