<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef0f3">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talk Radio">
<title>{% block title %}Sonos Talk Radio{% endblock %}</title>
<script>
// Stamped before the first paint, so a device set to dark never flashes
// light. "auto" (nothing stored) follows the system setting.
try {
  var m = localStorage.getItem("mode");
  if (m === "light" || m === "dark") document.documentElement.dataset.mode = m;
} catch (e) { /* private mode: follow the system */ }
</script>
<style>
@font-face {
  font-family: "Radio Canada Big"; font-weight: 400 700; font-style: normal; font-display: swap;
  src: url("/static/fonts/radiocanadabig-normal-var.woff2") format("woff2");
}
/* the text face's sibling: same drawing, figures tabular by default */
@font-face {
  font-family: "Radio Canada"; font-weight: 300 700; font-style: normal; font-display: swap;
  src: url("/static/fonts/radiocanada-normal-var.woff2") format("woff2");
}

/* ── palette ──────────────────────────────────────────────────────────
   Two modes, one token set. Light is the root; dark restates every token,
   once for the system setting and once for an explicit choice. Anything
   meant to be read is --ink or --slate (both clear 4.5:1 on --paper and
   --panel); --hair only draws rules and tracks. tools/check_contrast.py
   holds both modes to that. */
:root {
  --paper: #eef0f3;      /* the room */
  --panel: #ffffff;      /* what sits above it: menus, sheets, the dock */
  --ink: #171a21;
  --slate: #596070;      /* secondary text, resting controls */
  --hair: #d5d9e0;       /* rules, tracks, button outlines */
  --tally: #c8261b;      /* on air: the live light, the second hand, news */
  --ok: #1d7a3d;
  --arc: #767f90;        /* the dial's still-to-play arc: 3:1 on --paper, apart from --ink */
  --focus: #1f4fd1;
  --hover: rgb(23 26 33 / .06);
  --shadow: 0 1px 2px rgb(23 26 33 / .06), 0 10px 30px rgb(23 26 33 / .12);
  --scrim: rgb(10 12 16 / .45);
  --font: "Radio Canada Big", system-ui, sans-serif;
  --figures: "Radio Canada", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]) {
    --paper: #11151d; --panel: #1a1f29; --ink: #eaedf2; --slate: #9ba3b2;
    --hair: #2b313d; --tally: #ff5a4a; --ok: #5ccf7e; --arc: #6b7485;
    --focus: #8aa4ff; --hover: rgb(234 237 242 / .07);
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .4);
    --scrim: rgb(0 0 0 / .55);
    color-scheme: dark;
  }
}
:root[data-mode="dark"] {
  --paper: #11151d; --panel: #1a1f29; --ink: #eaedf2; --slate: #9ba3b2;
  --hair: #2b313d; --tally: #ff5a4a; --ok: #5ccf7e; --arc: #6b7485;
  --focus: #8aa4ff; --hover: rgb(234 237 242 / .07);
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .4);
  --scrim: rgb(0 0 0 / .55);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); }
body {
  background: var(--paper); color: var(--ink);
  font: 400 16px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  max-width: 1120px; margin: 0 auto; padding: 0 28px 96px;
}
::selection { background: var(--ink); color: var(--paper); }
img { display: block; }
/* every display rule above loses to the attribute, as the browser's own does */
[hidden] { display: none !important; }
a { color: inherit; }
.fig, .times, .at, .dur, .bdg, .vol .val { font-family: var(--figures); }
.slate { color: var(--slate); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible,
.vol:focus-visible, .track:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 16px; height: 16px; }

/* ── header ─────────────────────────────────────────────────────────── */
header {
  display: flex; align-items: center; gap: 28px; height: 72px;
  border-bottom: 1px solid var(--hair);
}
.mark { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px;
  letter-spacing: -.01em; text-decoration: none; }
/* the station's tally light: lit while on air, dark otherwise */
.mark .tally { width: 10px; height: 10px; border-radius: 50%; background: var(--hair); transition: background .3s; }
.mark.live .tally { background: var(--tally); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tally) 18%, transparent); }
nav.nav { display: flex; gap: 4px; align-self: stretch; }
.navlink {
  display: flex; align-items: center; padding: 0 14px; margin-bottom: -1px;
  color: var(--slate); text-decoration: none; font-weight: 500;
  border-bottom: 2px solid transparent;
}
.navlink:hover { color: var(--ink); }
.navlink.live { color: var(--ink); border-color: var(--ink); }
.modebtn { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: none; border: 0; color: var(--ink); cursor: pointer; }
.modebtn:hover { background: var(--hover); }

/* ── controls ───────────────────────────────────────────────────────── */
/* .tab is every button that is a button: an outlined pill. The names are
   historical — the scripts key on them — the look is not. */
button.tab {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 999px;
  background: none; color: var(--ink); border: 1px solid var(--hair);
  font: 500 15px/1.2 var(--font); cursor: pointer; white-space: nowrap;
}
button.tab:hover { background: var(--hover); }
button.tab:disabled { color: var(--slate); cursor: default; background: none; }
button.tab.pressed { background: var(--hover); }
button.tab.live { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button.tab.red { color: var(--tally); }
button.tab.small { min-height: 44px; padding: 0 14px; font-size: 14px; }
button.tab.armed, .flap button.armed {
  background: var(--tally); color: var(--paper); border-color: var(--tally);
}
.flap button.armed i { color: var(--paper); }
select, input[type="url"], input[type="number"], input[type="time"], input[type="search"], input[type="text"] {
  min-height: 48px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--hair);
  background: var(--panel); color: var(--ink); font: 400 16px var(--font);
}
select { padding-right: 12px; }
input::placeholder { color: var(--slate); }
label.chk {
  display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px;
  border: 1px solid var(--hair); border-radius: 999px; cursor: pointer; font-weight: 500;
}
label.chk input { accent-color: var(--ink); width: 18px; height: 18px; }

/* section heads: a sentence-case title, a quiet aside, actions to the right */
.sect { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 36px 0 8px; }
.sect h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.sect .aside { color: var(--slate); font-size: 15px; }
.sect .end { margin-left: auto; display: flex; gap: 8px; }
.empty { padding: 18px 0; color: var(--slate); }

/* ── menus ──────────────────────────────────────────────────────────── */
/* Anchored under their button on a wide screen; on a phone every menu is a
   sheet rising from the bottom over a scrim, above the docked controls, so
   none can open under the dock or off an edge. */
.flapwrap, .dropwrap { position: relative; }
.flap {
  position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; min-width: 280px;
  padding: 6px; border-radius: 14px; background: var(--panel);
  border: 1px solid var(--hair); box-shadow: var(--shadow);
}
.dropwrap .flap, .flap.right { left: auto; right: 0; }
.flap > button, .flap .spk-list + button {
  display: flex; align-items: center; justify-content: space-between; gap: 18px; width: 100%;
  min-height: 48px; padding: 0 14px; border-radius: 10px; border: 0; background: none;
  color: var(--ink); font: 500 16px var(--font); text-align: left; cursor: pointer;
}
.flap > button[hidden] { display: none; }
.flap > button:hover { background: var(--hover); }
.flap .danger { color: var(--tally); }
.flap i { color: var(--slate); font-style: normal; font-weight: 400; font-size: 14px; white-space: nowrap; }
.flap .danger i { color: var(--slate); }
.flap-field { display: grid; gap: 6px; padding: 8px 14px 12px; color: var(--slate); font-size: 14px; }
.flap-field select { width: 100%; }
@media (max-width: 760px) {
  .flap, .dropwrap .flap, .flap.right {
    position: fixed; top: auto; left: 8px; right: 8px; bottom: 8px; z-index: 40;
    min-width: 0; max-height: 80vh; overflow-y: auto; padding: 8px 8px 12px; border-radius: 18px;
  }
  /* A real layer, not a shadow: a tap on it lands on <body>, which only
     closes the menu, instead of falling through to the button beneath.
     Under the docks (z 20), which stay live as the remote. */
  body:has(.flap:not([hidden]))::after {
    content: ""; position: fixed; inset: 0; z-index: 15; background: var(--scrim);
  }
}

/* ── switches ───────────────────────────────────────────────────────── */
/* position says the state: knob right and filled is on */
.sw {
  position: relative; flex: none; width: 48px; height: 28px; padding: 0; cursor: pointer;
  border-radius: 14px; border: 2px solid var(--slate); background: none;
}
.sw::after { content: ""; position: absolute; inset: -10px -4px; }   /* 48px touch target */
.sw .knob {
  position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--slate); transition: transform .15s;
}
.sw.on { background: var(--ink); border-color: var(--ink); }
.sw.on .knob { transform: translateX(20px); background: var(--paper); }
@media (prefers-reduced-motion: reduce) { .sw .knob { transition: none; } }

#flash {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50;
  display: none; max-width: min(520px, 90vw); padding: 12px 20px; border-radius: 14px;
  background: var(--ink); color: var(--paper); font-weight: 500; box-shadow: var(--shadow);
}
#flash::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--tally); margin-right: 10px; vertical-align: 1px; }
#flash.ok::before { background: var(--ok); }

.showlink { color: inherit; text-decoration: none; }
.showlink:hover, .showlink:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
.qdesc[hidden], .npdesc[hidden] { display: none; }
.qdesc, .npdesc, .sheet-desc {
  max-width: 66ch; color: var(--slate); font-size: 15px; line-height: 1.55; white-space: pre-wrap;
}
.disc {
  display: inline-grid; place-items: center; width: 32px; height: 32px; margin: -8px 0 -8px 2px;
  vertical-align: middle; border-radius: 50%; border: 0; background: none; cursor: pointer;
  color: var(--slate); transition: transform .15s, color .15s;
}
.disc:hover { color: var(--ink); background: var(--hover); }
.disc[aria-expanded="true"] { color: var(--ink); transform: rotate(180deg); }
.disc svg { width: 16px; height: 16px; }

{% block style %}{% endblock %}

@media (max-width: 760px) {
  body { padding: 0 18px 120px; }
  header { height: auto; flex-wrap: wrap; gap: 0 12px; padding-top: 10px; }
  nav.nav { order: 3; width: 100%; height: 48px; }
  .navlink { flex: 1; justify-content: center; }
}
</style>
</head>
<body>

<header>
  <a class="mark" id="board-title" href="/"><span class="tally" aria-hidden="true"></span>Talk Radio</a>
  <nav class="nav" aria-label="Pages">
    <a class="navlink{{ ' live' if request.path == '/' else '' }}" href="/"{{ ' aria-current="page"' if request.path == '/' else '' }}>On air</a>
    <a class="navlink{{ ' live' if request.path.startswith('/stations') else '' }}" href="/stations"{{ ' aria-current="page"' if request.path.startswith('/stations') else '' }}>Stations</a>
  </nav>
  <button type="button" class="modebtn" id="btn-mode"></button>
</header>

{% block content %}{% endblock %}

<div id="flash" role="alert"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
let status = null;
let flashTimer = null;
const debounceTimers = new WeakMap();
function debounce(el, fn, ms = 300) {
  clearTimeout(debounceTimers.get(el));
  debounceTimers.set(el, setTimeout(fn, ms));
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML.replace(/"/g, "&quot;");
}

// ── episode descriptions ────────────────────────────────────────────
// Which rows are open lives here rather than in the DOM: both pages rewrite
// their row containers wholesale on the 5s poll, so an expansion held only
// as markup would collapse under whoever is reading it every five seconds.
// Same reasoning as lastStationsSig — server truth repaints, local intent
// has to survive the repaint.
const expandedEpisodes = new Set();

// The panel is always rendered and toggled with [hidden], never inserted on
// click. That keeps the description text in one place (the render, from the
// poll payload) instead of needing a second copy to re-insert from, and it
// means a poll landing mid-interaction repaints an already-correct row.
function discToggle(id, description, title) {
  if (!description) return "";                 // no notes, no caret
  const open = expandedEpisodes.has(String(id));
  return `<button type="button" class="disc" data-disc="${id}" ` +
    `aria-expanded="${open}" aria-controls="desc-${id}" ` +
    `aria-label="${open ? "Hide" : "Show"} description for ${esc(title)}"` +
    `>${CHEVRON}</button>`;
}
const CHEVRON = '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';

// A show's name, wherever it appears, opens that show's station sheet:
// "more of this" should not mean finding its tile by hand.
function showLink(feedId, show) {
  if (feedId == null) return esc(show);
  return `<a class="showlink" href="/stations#feed-${feedId}">${esc(show)}</a>`;
}

function discPanel(id, description) {
  if (!description) return "";
  const open = expandedEpisodes.has(String(id));
  return `<div class="qdesc" id="desc-${id}"${open ? "" : " hidden"}>` +
    `${esc(description)}</div>`;
}

document.addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-disc]");
  if (!btn) return;
  const id = String(btn.dataset.disc);
  const open = !expandedEpisodes.has(id);
  if (open) { expandedEpisodes.add(id); track("description"); }
  else expandedEpisodes.delete(id);
  btn.setAttribute("aria-expanded", String(open));
  const panel = document.getElementById(`desc-${id}`);
  if (panel) panel.hidden = !open;
});
// Sonos reports TRANSITIONING while it spins a track up — the window every
// skip and play-now lands in, since we poll the moment the action returns.
// That's playback starting, not a hold: transports read live during it.
function isPlaying(s) {
  return s.transport === "PLAYING" || s.transport === "TRANSITIONING";
}

function flash(msg, ok = false) {
  const el = $("flash");
  el.textContent = msg;
  el.className = ok ? "ok" : "";
  el.style.display = "block";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.style.display = "none"; }, 4000);
}
function fmt(sec) {
  sec = Math.max(0, sec | 0);
  const h = (sec / 3600) | 0, m = ((sec % 3600) / 60) | 0, s = sec % 60;
  const ms = String(s).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ms}` : `${m}:${ms}`;
}
function hm(date) {
  return String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");
}
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
// An episode's publication date, read straight off the ISO string rather than
// through Date — "2015-11-05T00:00:00Z" parsed and rendered locally lands on
// the 4th anywhere west of UTC, and a published date is a calendar date, not a
// moment. The archive spans a decade, so the year always shows.
function pubDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  return m ? `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}` : "";
}
// inline confirm: first press arms the button ("Sure?", 3 s), second fires.
// Replaces the native confirm() dialogs that broke the panel aesthetic.
function armed(btn) {
  if (btn.dataset.armed) {
    delete btn.dataset.armed;
    btn.classList.remove("armed");
    btn.textContent = btn.dataset.armLabel;
    btn.style.minWidth = "";
    return true;
  }
  btn.dataset.armed = "1";
  btn.dataset.armLabel = btn.textContent;
  btn.classList.add("armed");
  btn.setAttribute("aria-live", "polite");   // announce the Sure? swap
  // "Sure?" is narrower than any label it replaces; hold the width so the
  // finger that just pressed is still over the button for the second press
  btn.style.minWidth = `${btn.offsetWidth}px`;
  btn.textContent = "Sure?";
  setTimeout(() => {
    if (btn.isConnected && btn.dataset.armed) {
      delete btn.dataset.armed;
      btn.classList.remove("armed");
      btn.textContent = btn.dataset.armLabel;
      btn.style.minWidth = "";
    }
  }, 3000);
  return false;
}
// Counts a job the page does without asking the server (opening a panel,
// filtering), so the usage log sees it too. Fire and forget: a lost count
// must never cost the listener anything.
function track(event) {
  fetch("/api/usage", {
    method: "POST", keepalive: true,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ event }),
  }).catch(() => {});
}
async function post(path, body, btn) {
  if (btn) { btn.classList.add("pressed"); setTimeout(() => btn.classList.remove("pressed"), 350); }
  try {
    const resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const data = await resp.json();
    if (!data.ok) flash(data.error || "Something went wrong");
    await poll();
    return data.ok;
  } catch (err) { flash("Server unreachable"); return false; }
}
async function poll() {
  try {
    status = await (await fetch("/api/status")).json();
    // the tally light is lit only while on air
    $("board-title").classList.toggle("live", status.dj_state === "playing");
    renderPage(status);
  } catch (err) { /* transient: keep last render */ }
}

// ── flaps ──────────────────────────────────────────────────────────
// One toggle serves every flap on either page: the button names the
// panel it opens, so a new one is markup and nothing else.
function closeFlaps(except) {
  for (const btn of document.querySelectorAll("[data-flap]")) {
    if (btn.dataset.flap === except) continue;
    $(btn.dataset.flap).hidden = true;
    btn.setAttribute("aria-expanded", "false");
  }
}
document.addEventListener("click", (ev) => {
  // a flap of several choices (rooms) stays open while you make them
  if (ev.target.closest("[data-flap-keep]")) return;
  const toggle = ev.target.closest("[data-flap]");
  closeFlaps(toggle ? toggle.dataset.flap : null);
  if (!toggle) return;
  const flap = $(toggle.dataset.flap);
  flap.hidden = !flap.hidden;
  toggle.setAttribute("aria-expanded", String(!flap.hidden));
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") closeFlaps(null);
});

// ── light and dark ─────────────────────────────────────────────────
// Per device, not per household: the wall tablet in daylight and the bedside
// phone at midnight want different answers. Auto (nothing stored) follows
// the system; the button steps Auto → Light → Dark → Auto.
const MODES = ["auto", "light", "dark"];
const MODE_ICON = {
  auto: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>',
  light: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
};
function currentMode() {
  return document.documentElement.dataset.mode || "auto";
}
function paintMode() {
  const mode = currentMode();
  const btn = $("btn-mode");
  btn.innerHTML = MODE_ICON[mode];
  const label = `Appearance: ${mode === "auto" ? "match this device" : mode}`;
  btn.title = label;
  btn.setAttribute("aria-label", label);
  // the address bar and the PWA splash follow the page
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--paper").trim());
}
$("btn-mode").addEventListener("click", () => {
  const next = MODES[(MODES.indexOf(currentMode()) + 1) % MODES.length];
  if (next === "auto") delete document.documentElement.dataset.mode;
  else document.documentElement.dataset.mode = next;
  try {
    if (next === "auto") localStorage.removeItem("mode"); else localStorage.setItem("mode", next);
  } catch (e) { /* not fatal */ }
  paintMode();
  document.dispatchEvent(new CustomEvent("modechange"));
  track("mode");
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintMode);
paintMode();
</script>
{% block script %}{% endblock %}
<script>
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
